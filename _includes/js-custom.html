<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>

<script>
  window.avatarFallback = function (img) {
    var alias = img.dataset.alias || "";
    var base = img.dataset.base || "{{ '/img/' | relative_url }}";
    var attempt = Number(img.dataset.attempt || "0");

    if (attempt === 0) {
      img.dataset.attempt = "1";
      img.src = base + alias + ".png";
      return;
    }
    if (attempt === 1) {
      img.dataset.attempt = "2";
      img.src = base + alias + ".jpeg";
      return;
    }
    if (attempt === 2) {
      img.dataset.attempt = "3";
      img.src = "https://unavatar.io/twitter/" + alias;
      return;
    }

    img.onerror = null;
    img.src = "{{ '/img/avatar-placeholder.svg' | relative_url }}";
  };

  window.topFunction = function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  document.addEventListener("DOMContentLoaded", function () {
    var scrollButton = document.getElementById("myBtn");
    if (scrollButton) {
      var toggleScrollButton = function () {
        var shouldShow = window.scrollY > 20;
        scrollButton.style.display = shouldShow ? "block" : "none";
      };

      window.addEventListener("scroll", toggleScrollButton, { passive: true });
      toggleScrollButton();
    }

    var searchInput = document.getElementById("search-input");
    var resultsContainer = document.getElementById("results-container");
    if (searchInput && resultsContainer && window.SimpleJekyllSearch) {
      window.SimpleJekyllSearch({
        searchInput: searchInput,
        resultsContainer: resultsContainer,
        json: "{{ '/search.json' | relative_url }}",
        searchResultTemplate: '<a class="list-group-item list-group-item-action d-flex align-items-center" href="javascript:void(0)" data-toggle="modal" data-target="#{modal_id}"><img src="{{ '/img/' | relative_url }}{alias}.jpg" data-base="{{ '/img/' | relative_url }}" data-alias="{alias}" data-attempt="0" onerror="avatarFallback(this)" alt="{nombre}" width="32" height="32" class="rounded me-2" loading="lazy"><span><strong>{nombre}</strong> @{alias}</span></a>',
        noResultsText: '<p class="lead">Vaya, ese nombre no está registrado, <a href="{{ '/nuevo.html' | relative_url }}">¿quieres añadirlo?</a></p>',
        limit: 10,
        fuzzy: false,
        exclude: ["Welcome"]
      });
    }
  });
</script>
